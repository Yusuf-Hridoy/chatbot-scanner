name: crisp
verified: false
description: >-
  Selectors for the Crisp chatbox (rendered in the page, no iframe). The input and bot_message selectors
  worked on a real Crisp widget, but sender-name handling still needs one real check: if a reply starts with
  the agent's name, set message_text. Run 'audit check' first; use 'audit connect' if it fails.
selectors:
  frame: null
  open_button: "a[aria-label='Open chat'], .cc-1brb6[data-visible='true'], #crisp-chatbox [data-id='chat_closed']"
  input: "textarea[name='message']"
  send_button: null
  bot_message: "[class*='--operator'][class*='--text']"
  typing_indicator: "#crisp-chatbox [data-id='message_compose_typing'], #crisp-chatbox .cc-typing"
dismiss_selectors: []
chat_dismiss_selectors:
  - "button:has-text('Skip')"
