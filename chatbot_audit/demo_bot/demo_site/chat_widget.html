<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Skincare chat</title>
<link rel="stylesheet" href="/static/demo_site.css">
</head>
<body class="widget">
<!--PANEL-START-->
<section class="chat-panel" data-chat-panel aria-label="Lumen Skincare chat">
  <header class="chat-header">Lumen Skincare support</header>
  <div class="chat-messages" data-chat-messages aria-live="polite"></div>
  <div class="typing-indicator" data-chat-typing hidden><span></span><span></span><span></span></div>
  <form class="chat-form" data-chat-form>
    <textarea data-chat-input rows="2" placeholder="Type your message…" aria-label="Message"></textarea>
    <button type="submit" data-chat-send>Send</button>
  </form>
</section>
<!--PANEL-END-->
<script src="/static/chat_widget.js"></script>
</body>
</html>
