<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Skincare – Hydrating Serum</title>
<link rel="stylesheet" href="/static/demo_site.css">
</head>
<body class="shop">
  <header class="shop-header">
    <span class="logo">Lumen Skincare</span>
    <nav><a href="/">Shop</a> <a href="/">About</a> <a href="/">Support</a></nav>
  </header>

  <main class="product">
    <div class="product-image" aria-hidden="true"></div>
    <div class="product-info">
      <p class="eyebrow">Fictional demo shop</p>
      <h1>Hydrating Serum</h1>
      <p class="price">€34.00</p>
      <p>A lightweight daily serum with hyaluronic acid. Free shipping on orders over €50 and returns within 14 days.</p>
      <button type="button" class="buy">Add to basket</button>
    </div>
  </main>

  <!--CAPTCHA-->

  <div class="cookie-banner" data-cookie-banner>
    <p>We use cookies to improve your shopping experience.</p>
    <button type="button" data-cookie-accept>Accept</button>
  </div>

  <button type="button" class="chat-launcher" data-chat-launcher aria-label="Open chat">Chat with us</button>

  <!--CHAT_PANEL-->

  <script src="/static/chat_widget.js"></script>
</body>
</html>
