# Connection test for a real Crisp chat widget. See HOW_TO_TEST.md.
client: crisp-test
display_name: Crisp widget connection test
tier: quick
target:
  type: browser
  url: http://localhost:8000/
  preset: crisp
  headless: false
limits:
  max_messages_per_minute: 10
  max_parallel_conversations: 1
  timeout_seconds: 90
