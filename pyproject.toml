[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-audit"
version = "0.1.0"
description = "Audit customer-facing AI chatbots with scripted attack conversations and rule-based checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "jinja2",
    "playwright",
]

[project.optional-dependencies]
pdf = []  # kept so `pip install -e ".[pdf]"` still works; playwright is now a main dependency
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
audit = "chatbot_audit.audit_cli:app"

[tool.setuptools.packages.find]
include = ["chatbot_audit*"]

[tool.setuptools.package-data]
chatbot_audit = [
    "attacks/attack_packs/*.yaml",
    "report_templates/*.j2",
    "adapters/widget_presets/*.yaml",
    "connect/*.js",
    "demo_bot/demo_site/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: needs Chromium (skipped with a clear reason when it is not installed)"]
